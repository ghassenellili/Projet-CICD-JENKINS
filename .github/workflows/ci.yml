name: CI - Build and Test (Bonus GitHub Actions)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Lint & Parallel Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies (Build)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          mkdir -p build/test-results

      - name: Run Unit Tests (JUnit XML)
        run: |
          python -m pytest tests/test_unit.py --junitxml=build/test-results/unit-report.xml

      - name: Run HTTP Integration Tests (JUnit XML)
        run: |
          python -m pytest tests/test_http.py --junitxml=build/test-results/http-report.xml

      - name: Upload JUnit XML Test Reports (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: build/test-results/*.xml
